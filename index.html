<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Schedule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f4;
      --bg-tertiary: #eeede9;
      --text-primary: #1a1a1a;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border-light: rgba(0,0,0,0.08);
      --border-med: rgba(0,0,0,0.15);
      --radius-md: 8px;
      --radius-lg: 12px;
      --accent: #378ADD;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --bg-tertiary: #3a3a3c;
        --text-primary: #f2f2f7;
        --text-secondary: #aeaeb2;
        --text-tertiary: #636366;
        --border-light: rgba(255,255,255,0.08);
        --border-med: rgba(255,255,255,0.15);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1rem;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 2rem;
    }

    /* Header */
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding: 0 0.25rem;
    }
    .ttl {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .ttl i { color: var(--accent); font-size: 22px; }
    .ver {
      font-size: 11px;
      color: var(--text-tertiary);
      background: var(--bg-secondary);
      padding: 2px 7px;
      border-radius: 99px;
      border: 0.5px solid var(--border-light);
    }

    /* Nav tabs */
    .ntabs {
      display: flex;
      gap: 4px;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
    }
    .ntab {
      flex: 1;
      padding: 7px 4px;
      border: none;
      background: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      font-family: inherit;
    }
    .ntab.on {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-weight: 500;
      border: 0.5px solid var(--border-light);
    }

    /* Tab content */
    .tc { display: none; }
    .tc.on { display: block; }

    /* Hero card */
    .hero {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .dbadge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 0.6rem;
    }
    .ba { background: #E6F1FB; color: #0C447C; }
    .bb { background: #E1F5EE; color: #085041; }
    .bs { background: #FAEEDA; color: #633806; }

    @media (prefers-color-scheme: dark) {
      .ba { background: #0C447C; color: #B5D4F4; }
      .bb { background: #085041; color: #9FE1CB; }
      .bs { background: #633806; color: #FAC775; }
    }

    .ddate { font-size: 13px; color: var(--text-secondary); margin-bottom: 0.2rem; }
    .dname { font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 1rem; }

    /* Countdown grid */
    .cds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cdc {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
    }
    .cdl {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .cdv {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .cds2 { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

    /* Progress bar */
    .pbar {
      height: 3px;
      background: var(--border-light);
      border-radius: 99px;
      margin-top: 1rem;
      overflow: hidden;
    }
    .pfill { height: 100%; border-radius: 99px; transition: width 0.5s; }
    .plbl {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* Section title */
    .sth {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 1.25rem 0 0.5rem;
    }

    /* Schedule list */
    .slist { display: flex; flex-direction: column; gap: 6px; }

    /* Class card */
    .ccard {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s;
    }
    .ccard:hover { background: var(--bg-secondary); }
    .ccard.now { border-width: 1.5px; }
    .csw {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .cmeta {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .cmeta i { font-size: 12px; }

    /* Lunch card */
    .lcard {
      background: var(--bg-secondary);
      border: 0.5px dashed var(--border-med);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
    }

    /* Days off card */
    .docard {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dopill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      background: #FAEEDA;
      color: #633806;
      white-space: nowrap;
    }
    @media (prefers-color-scheme: dark) {
      .dopill { background: #633806; color: #FAC775; }
    }

    /* Settings */
    .ssec { margin-bottom: 1.25rem; }
    .scard {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .srow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 0.5px solid var(--border-light);
      gap: 12px;
    }
    .srow:last-child { border-bottom: none; }
    .slbl { font-size: 14px; color: var(--text-primary); }
    .ssub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* Toggle */
    .tog { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .tog input { opacity: 0; width: 0; height: 0; }
    .tsl {
      position: absolute;
      inset: 0;
      background: var(--border-med);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .tog input:checked + .tsl { background: var(--accent); }
    .tsl::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .tog input:checked + .tsl::before { transform: translateX(18px); }

    /* Color editor */
    .cecard {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .cesw {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      cursor: pointer;
      border: 0.5px solid var(--border-light);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cesw input[type=color] {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      opacity: 0;
      cursor: pointer;
    }
    .pdot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      transition: transform 0.1s;
    }
    .pdot:hover { transform: scale(1.15); }
    .pdot.on { border-color: var(--text-primary); }

    select {
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-md);
      padding: 5px 10px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
    }

    /* Sub schedule tabs */
    .stabs {
      display: flex;
      gap: 4px;
      margin-bottom: 1rem;
    }
    .stab {
      padding: 6px 20px;
      border: 0.5px solid var(--border-light);
      background: none;
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
      font-family: inherit;
    }
    .stab.on {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="ttl">
      <i class="ti ti-calendar"></i>
      My Schedule
      <span class="ver">v1.1</span>
    </div>
  </div>

  <div class="ntabs">
    <button class="ntab on" onclick="sw('today')">Today</button>
    <button class="ntab" onclick="sw('schedule')">Schedule</button>
    <button class="ntab" onclick="sw('daysoff')">Days off</button>
    <button class="ntab" onclick="sw('settings')">Settings</button>
  </div>

  <!-- TODAY TAB -->
  <div id="t-today" class="tc on">
    <div class="hero">
      <div id="dbadge" class="dbadge ba">
        <i class="ti ti-calendar-event"></i>
        <span id="dbtext">A Day</span>
      </div>
      <div class="ddate" id="ddate"></div>
      <div class="dname" id="dname"></div>
      <div class="cds">
        <div class="cdc">
          <div class="cdl">Current class ends</div>
          <div class="cdv" id="cc">—</div>
          <div class="cds2" id="ccs">No class right now</div>
        </div>
        <div class="cdc">
          <div class="cdl">School ends in</div>
          <div class="cdv" id="sc">—</div>
          <div class="cds2" id="scs"></div>
        </div>
      </div>
      <div class="pbar">
        <div class="pfill" id="yp" style="width:0%"></div>
      </div>
      <div class="plbl">
        <span>Sep 2, 2025</span>
        <span id="ypct"></span>
        <span>Jun 5, 2026</span>
      </div>
    </div>
    <div class="sth">Today's classes</div>
    <div class="slist" id="todaySched"></div>
  </div>

  <!-- SCHEDULE TAB -->
  <div id="t-schedule" class="tc">
    <div class="stabs">
      <button class="stab on" id="tabA" onclick="swSched('A')">A Day</button>
      <button class="stab" id="tabB" onclick="swSched('B')">B Day</button>
    </div>
    <div class="slist" id="fullSched"></div>
  </div>

  <!-- DAYS OFF TAB -->
  <div id="t-daysoff" class="tc">
    <div class="slist" id="dolist"></div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="t-settings" class="tc">
    <div class="ssec">
      <div class="sth">Display</div>
      <div class="scard">
        <div class="srow">
          <div><div class="slbl">Show room numbers</div></div>
          <label class="tog"><input type="checkbox" id="tr" checked onchange="renderToday();renderFull(sTab)"><span class="tsl"></span></label>
        </div>
        <div class="srow">
          <div><div class="slbl">24-hour time</div></div>
          <label class="tog"><input type="checkbox" id="t24" onchange="renderToday();renderFull(sTab)"><span class="tsl"></span></label>
        </div>
        <div class="srow">
          <div><div class="slbl">Day type override</div><div class="ssub">Force A, B, or assembly</div></div>
          <select id="dov" onchange="renderToday()">
            <option value="auto">Auto</option>
            <option value="A">A Day</option>
            <option value="B">B Day</option>
            <option value="special">Assembly</option>
          </select>
        </div>
      </div>
    </div>
    <div class="ssec">
      <div class="sth">Class colors — A Day</div>
      <div id="ceA"></div>
    </div>
    <div class="ssec">
      <div class="sth">Class colors — B Day</div>
      <div id="ceB"></div>
    </div>
  </div>

</div>

<script>
  /* ── DATA ── Edit these to match your real schedule! ── */
  const SA = [
    { name: 'AP English',      room: '204',   start: '8:00',  end: '9:25',  color: '#378ADD', icon: 'ti-book' },
    { name: 'Calculus AB',     room: '118',   start: '9:30',  end: '10:55', color: '#1D9E75', icon: 'ti-math-function' },
    { name: 'Lunch',           room: '',      start: '10:55', end: '11:30', color: null,      icon: null },
    { name: 'Physics',         room: '312',   start: '11:35', end: '13:00', color: '#7F77DD', icon: 'ti-atom' },
    { name: 'Computer Science',room: 'Lab B', start: '13:05', end: '14:30', color: '#D85A30', icon: 'ti-code' },
  ];
  const SB = [
    { name: 'US History',  room: '207',    start: '8:00',  end: '9:25',  color: '#BA7517', icon: 'ti-globe' },
    { name: 'Spanish III', room: '105',    start: '9:30',  end: '10:55', color: '#D4537E', icon: 'ti-language' },
    { name: 'Lunch',       room: '',       start: '10:55', end: '11:30', color: null,      icon: null },
    { name: 'Art & Design',room: 'Studio', start: '11:35', end: '13:00', color: '#639922', icon: 'ti-palette' },
    { name: 'PE',          room: 'Gym',    start: '13:05', end: '14:30', color: '#888780', icon: 'ti-run' },
  ];
  const DO = [
    { name: 'Break A',            date: '2026-05-22', type: 'Day off' },
    { name: 'Memorial Day',       date: '2026-05-25', type: 'No school' },
    { name: 'Last day of school', date: '2026-06-05', type: 'End of year' },
  ];
  const SCHOOL_START = new Date('2025-09-02');
  const SCHOOL_END   = new Date('2026-06-05');
  const PRESETS = ['#378ADD','#1D9E75','#7F77DD','#D85A30','#D4537E','#639922','#BA7517','#E24B4A','#888780','#0F6E56'];

  /* ── HELPERS ── */
  let sTab = 'A';
  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function tm(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }

  function ft(t, u24) {
    if (u24) return t;
    const [h,m] = t.split(':').map(Number);
    return `${h%12||12}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`;
  }

  function getDT() {
    const ov = document.getElementById('dov')?.value;
    if (ov && ov !== 'auto') return ov;
    const now = new Date();
    let c = 0;
    for (let d = new Date(SCHOOL_START); d <= now; d.setDate(d.getDate()+1))
      if (d.getDay() >= 1 && d.getDay() <= 5) c++;
    return c % 2 === 1 ? 'A' : 'B';
  }

  function fc(s) {
    if (s <= 0) return '—';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sc = s%60;
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${sc.toString().padStart(2,'0')}s`;
    return `${sc}s`;
  }

  function rgb(hex) {
    return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
  }
  function swBg(hex) { const {r,g,b} = rgb(hex); return `rgba(${r},${g},${b},0.15)`; }

  /* ── RENDER CLASS CARD ── */
  function mkCard(cls, nowM, u24, showR) {
    if (!cls.color) {
      const el = document.createElement('div');
      el.className = 'lcard';
      el.innerHTML = `<i class="ti ti-tools-kitchen-2" style="font-size:18px"></i>
        <div>
          <div style="font-size:14px;font-weight:500;color:var(--text-primary)">Lunch</div>
          <div style="font-size:12px;color:var(--text-secondary)">${ft(cls.start,u24)} – ${ft(cls.end,u24)}</div>
        </div>`;
      return el;
    }
    const sm = tm(cls.start), em = tm(cls.end);
    const isNow = nowM !== null && nowM >= sm && nowM < em;
    const el = document.createElement('div');
    el.className = 'ccard' + (isNow ? ' now' : '');
    if (isNow) el.style.borderColor = cls.color;
    el.innerHTML = `
      <div class="csw" style="background:${swBg(cls.color)}">
        <i class="ti ${cls.icon||'ti-book'}" style="color:${cls.color};font-size:18px"></i>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500;color:var(--text-primary)">${cls.name}</div>
        <div class="cmeta">
          <span>${ft(cls.start,u24)} – ${ft(cls.end,u24)}</span>
          ${showR && cls.room ? `<span style="display:flex;align-items:center;gap:3px"><i class="ti ti-door"></i>${cls.room}</span>` : ''}
        </div>
      </div>
      <div style="width:4px;height:36px;border-radius:99px;background:${cls.color};flex-shrink:0"></div>`;
    return el;
  }

  /* ── RENDER TODAY ── */
  function renderToday() {
    const now  = new Date();
    const u24  = document.getElementById('t24')?.checked;
    const showR = document.getElementById('tr')?.checked !== false;
    const dt   = getDT();
    const sched = dt === 'B' ? SB : SA;

    document.getElementById('ddate').textContent =
      `${DAYS[now.getDay()]}, ${MONS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    const h = now.getHours();
    document.getElementById('dname').textContent =
      h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';

    const badge = document.getElementById('dbadge');
    const btxt  = document.getElementById('dbtext');
    if (dt === 'special') { badge.className='dbadge bs'; btxt.textContent='Assembly Day'; }
    else if (dt === 'B')  { badge.className='dbadge bb'; btxt.textContent='B Day'; }
    else                  { badge.className='dbadge ba'; btxt.textContent='A Day'; }

    const nm  = now.getHours()*60 + now.getMinutes();
    const ns  = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    const lc  = sched[sched.length - 1];
    const ses = tm(lc.end) * 60;

    let cv = '—', cs = 'No class right now', sv = '—', ss2 = '';

    if (ns < ses) {
      sv  = fc(ses - ns);
      ss2 = `Ends at ${ft(lc.end, u24)}`;
    } else {
      sv  = 'Done!';
      ss2 = 'School is over';
    }

    for (const c of sched) {
      if (!c.color) continue;
      const sm = tm(c.start), em = tm(c.end);
      if (nm >= sm && nm < em)  { cv = fc(em*60 - ns); cs = c.name; break; }
      if (nm < sm)              { cv = fc(sm*60 - ns); cs = `Until ${c.name}`; break; }
    }

    document.getElementById('cc').textContent  = cv;
    document.getElementById('ccs').textContent = cs;
    document.getElementById('sc').textContent  = sv;
    document.getElementById('scs').textContent = ss2;

    const total  = (SCHOOL_END - SCHOOL_START) / 86400000;
    const passed = (now - SCHOOL_START) / 86400000;
    const pct    = Math.min(100, Math.max(0, Math.round(passed / total * 100)));
    const fill   = document.getElementById('yp');
    fill.style.width      = pct + '%';
    fill.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#378ADD';
    document.getElementById('ypct').textContent = pct + '% done';

    const con = document.getElementById('todaySched');
    con.innerHTML = '';
    sched.forEach(c => con.appendChild(mkCard(c, nm, u24, showR)));
  }

  /* ── RENDER FULL SCHEDULE ── */
  function renderFull(type) {
    const sched = type === 'B' ? SB : SA;
    const u24   = document.getElementById('t24')?.checked;
    const showR = document.getElementById('tr')?.checked !== false;
    const con   = document.getElementById('fullSched');
    con.innerHTML = '';
    sched.forEach(c => con.appendChild(mkCard(c, null, u24, showR)));
  }

  /* ── RENDER DAYS OFF ── */
  function renderDO() {
    const now = new Date();
    const con = document.getElementById('dolist');
    con.innerHTML = '';
    [...DO].sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(d => {
      const dt   = new Date(d.date);
      const diff = Math.round((dt - now) / 86400000);
      const el   = document.createElement('div');
      el.className = 'docard';
      el.innerHTML = `
        <div>
          <div style="font-size:14px;color:var(--text-primary)">${d.name}</div>
          <div style="font-size:12px;color:var(--text-secondary)">${MONS[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          ${diff < 0
            ? '<span style="font-size:11px;padding:3px 8px;border-radius:99px;background:var(--bg-secondary);color:var(--text-tertiary)">Past</span>'
            : `<span style="font-size:11px;color:var(--text-secondary)">${diff}d</span><span class="dopill">${d.type}</span>`}
        </div>`;
      con.appendChild(el);
    });
  }

  /* ── BUILD COLOR EDITOR ── */
  function buildCE(sched, cid) {
    const con = document.getElementById(cid);
    con.innerHTML = '';
    sched.filter(c => c.color).forEach((cls, idx) => {
      const card = document.createElement('div');
      card.className = 'cecard';
      const sid = `sw-${cid}-${idx}`;
      const ph  = PRESETS.map(p =>
        `<div class="pdot${cls.color===p?' on':''}" style="background:${p}" data-c="${p}" title="${p}"></div>`
      ).join('');
      card.innerHTML = `
        <div class="cesw" style="background:${swBg(cls.color)}" title="Click to pick a custom color">
          <i class="ti ${cls.icon||'ti-book'}" id="icon-${sid}" style="color:${cls.color};font-size:19px"></i>
          <input type="color" value="${cls.color}" id="${sid}" aria-label="Color for ${cls.name}">
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:7px">${cls.name}</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap" id="p-${sid}">${ph}</div>
        </div>`;
      con.appendChild(card);

      const inp   = card.querySelector(`#${sid}`);
      const swEl  = card.querySelector('.cesw');
      const icEl  = card.querySelector(`#icon-${sid}`);
      const psEl  = card.querySelector(`#p-${sid}`);

      function apply(hex) {
        cls.color = hex;
        inp.value = hex;
        swEl.style.background = swBg(hex);
        icEl.style.color = hex;
        psEl.querySelectorAll('.pdot').forEach(d => d.classList.toggle('on', d.dataset.c === hex));
        renderToday();
        if (sTab === (cid.endsWith('A') ? 'A' : 'B')) renderFull(sTab);
      }
      inp.addEventListener('input', e => apply(e.target.value));
      psEl.addEventListener('click', e => { const d = e.target.closest('.pdot'); if (d) apply(d.dataset.c); });
    });
  }

  /* ── TAB SWITCHING ── */
  function sw(name) {
    const names = ['today','schedule','daysoff','settings'];
    document.querySelectorAll('.ntab').forEach((t,i) => t.classList.toggle('on', names[i] === name));
    document.querySelectorAll('.tc').forEach(t => t.classList.remove('on'));
    document.getElementById('t-' + name).classList.add('on');
    if (name === 'schedule') renderFull(sTab);
    if (name === 'daysoff')  renderDO();
    if (name === 'settings') { buildCE(SA,'ceA'); buildCE(SB,'ceB'); }
  }

  function swSched(type) {
    sTab = type;
    document.getElementById('tabA').classList.toggle('on', type === 'A');
    document.getElementById('tabB').classList.toggle('on', type === 'B');
    renderFull(type);
  }

  /* ── INIT ── */
  renderToday();
  renderDO();
  setInterval(renderToday, 1000);
</script>
</body>
</html>
